name: Verify Sip Railway Deployment
on:
  push:
    branches: [work/sip-railway-live-check]
    paths: ['.github/workflows/sip-railway-check-temp.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify live HTTP and API boundaries without credentials
        run: |
          python3 - <<'PY'
          import json, time, hashlib, urllib.request, urllib.error
          from pathlib import Path
          origin='https://sip-journal-production.up.railway.app'
          checks=[]
          def get(path):
              req=urllib.request.Request(origin+path, headers={'User-Agent':'SipJournalDeploymentCheck/1.1','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.status, r.headers, r.read()
          for attempt in range(4):
              try:
                  status,headers,data=get('/healthz')
                  assert status==200 and json.loads(data)['ok'] is True
                  checks.append({'name':'HTTPS health check','ok':True})
                  break
              except Exception:
                  if attempt==3: raise
                  time.sleep(5)
          status,headers,data=get('/sip/')
          assert status==200 and '잔의 기록' in data.decode('utf-8')
          checks.append({'name':'Korean app shell','ok':True})
          expected=json.loads(Path('sip/version.json').read_text())
          status,headers,data=get('/sip/version.json')
          assert json.loads(data)==expected and expected['version']=='1.1.0'
          checks.append({'name':'Version 1.1.0 matches main','ok':True})
          for name in ['assets/app.js','assets/domain.js','assets/api.js','assets/storage.js','assets/ui.js','assets/style.css','assets/icon-192.png','manifest.webmanifest','sw.js']:
              status,headers,data=get('/sip/'+name)
              assert status==200 and hashlib.sha256(data).digest()==hashlib.sha256(Path('sip',name).read_bytes()).digest(), name
              checks.append({'name':'Live asset matches source: '+name,'ok':True})
          status,headers,data=get('/sip/api/session')
          session=json.loads(data)
          assert status==200 and session['mode']=='shared-openai' and session['configured'] is True
          assert session['authorized'] is False and session['apiConfigured'] is False
          assert session['connected']['openai'] is False
          assert headers.get('Cache-Control')=='no-store'
          cookies=headers.get_all('Set-Cookie') or []
          assert cookies and all('HttpOnly' in c and 'Secure' in c and 'SameSite=Strict' in c for c in cookies)
          checks.append({'name':'Configured family server; OpenAI correctly disabled without operator key','ok':True})
          checks.append({'name':'Secure HttpOnly Strict cookie; private response not cached','ok':True})
          for path in ['/sip/server/index.mjs','/sip/.env','/sip/.env.example','/data/sip/family-v1.enc']:
              try:
                  get(path)
                  raise AssertionError('Private path exposed: '+path)
              except urllib.error.HTTPError as e:
                  assert e.code==404,(path,e.code)
              checks.append({'name':'Private path rejected: '+path,'ok':True})
          req=urllib.request.Request(origin+'/sip/api/approve',data=b'{}',headers={'Content-Type':'application/json'},method='POST')
          try:
              urllib.request.urlopen(req,timeout=20)
              raise AssertionError('Missing CSRF was allowed')
          except urllib.error.HTTPError as e:
              assert e.code==403,e.code
          checks.append({'name':'Unapproved cross-origin state change rejected','ok':True})
          report={'origin':origin,'version':expected['version'],'checks':checks,'actualOpenAiRequest':False,'operatorKeyRequired':True}
          Path('sip-live-check.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sip-railway-live-check
          path: sip-live-check.json
          retention-days: 7
