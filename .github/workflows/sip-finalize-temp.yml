name: Finalize Sip Journal
on:
  push:
    branches: [work/sip-journal-v1]
    paths: ['.github/workflows/sip-finalize-temp.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guarded photo and draft fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('sip')
          def change(file,old,new):
              p=root/file;s=p.read_text()
              if old not in s: raise RuntimeError('Unexpected source: '+str(p))
              p.write_text(s.replace(old,new))
          change('assets/ui.js',"(t.tags||[]).join(', ')","(Array.isArray(t.tags)?t.tags.join(', '):String(t.tags||''))")
          change('index.html','rel="apple-touch-icon" href="assets/icon.svg"','rel="apple-touch-icon" href="assets/icon-180.png"')
          p=root/'manifest.webmanifest';m=json.loads(p.read_text());m['icons']=[{'src':'assets/icon-192.png','sizes':'192x192','type':'image/png','purpose':'any'},{'src':'assets/icon-512.png','sizes':'512x512','type':'image/png','purpose':'any maskable'}];p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          change('sw.js',"'./assets/icon.svg'];","'./assets/icon.svg','./assets/icon-180.png','./assets/icon-192.png','./assets/icon-512.png'];")
          p=root/'tests/browser.mjs';s=p.read_text()
          marker='try{\n await page.goto(base);'
          assert marker in s
          generate="""const svg=await readFile(new URL('../assets/icon.svg',import.meta.url),'utf8');
          for(const size of [180,192,512]){const imagePage=await context.newPage();await imagePage.setViewportSize({width:size,height:size});await imagePage.setContent('<style>html,body{margin:0;padding:0;background:transparent}</style>'+svg.replace('width="512"',`width="${size}"`).replace('height="512"',`height="${size}"`));await imagePage.screenshot({path:new URL(`../assets/icon-${size}.png`,import.meta.url).pathname,omitBackground:true});await imagePage.close();}
          try{
           await page.goto(base);"""
          s=s.replace(marker,generate)
          marker="await p.locator('[name=rating]').fill('4.5');"
          assert marker in s
          s=s.replace(marker,marker+"await p.locator('[name=tags]').fill('여행, 가족');const picking=p.waitForEvent('filechooser');await p.locator('[data-act=editor-photo]').click();await (await picking).setFiles(new URL('../assets/icon-180.png',import.meta.url).pathname);await p.locator('.photo-strip img').waitFor();assert.equal(await p.locator('[name=tags]').inputValue(),'여행, 가족');")
          s=s.replace("check('manual memory saves to real IndexedDB');","check('manual memory saves to real IndexedDB');check('photo attachment preserves tags and typed form values');")
          s=s.replace("await page.locator('[name=note]').fill('저장하기 전 작성 중');","await page.locator('[name=note]').fill('저장하기 전 작성 중');await page.locator('[name=tags]').fill('초안, 여행');")
          s=s.replace("check('draft is restored after interrupted editing');","assert.equal(await page.locator('[name=tags]').inputValue(),'초안, 여행');check('tagged draft is restored after interrupted editing');")
          p.write_text(s)
          p=root/'tests/domain.test.mjs';p.write_text(p.read_text()+'''\ntest('editor accepts string tags from a restored draft',async()=>{const {editor}=await import('../assets/ui.js');const html=editor({title:'A',kind:'wine'},{tags:'여행, 가족',photos:[]});assert.ok(html.includes('여행, 가족'));});\n''')
          PY
      - name: Syntax and unit regression
        working-directory: sip
        run: |
          for f in assets/*.js server/*.mjs sw.js; do node --check "$f"; done
          TZ=Asia/Seoul npm test
          TZ=America/New_York npm test
      - name: Install browser
        working-directory: sip
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Real browser and PNG generation
        working-directory: sip
        run: node tests/browser.mjs
      - name: Commit tested journal fixes only
        run: |
          git diff --check
          git add sip/assets/ui.js sip/assets/icon-180.png sip/assets/icon-192.png sip/assets/icon-512.png sip/index.html sip/manifest.webmanifest sip/sw.js sip/tests/browser.mjs sip/tests/domain.test.mjs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(sip): preserve tagged photo drafts and add install icons'
          git push origin HEAD:work/sip-journal-v1
      - name: Archive current source
        if: always()
        run: zip -qr sip-source.zip sip -x 'sip/node_modules/*' 'sip/test-results/*'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sip-final-validation
          path: |
            sip/test-results/
            sip-source.zip
          retention-days: 14
