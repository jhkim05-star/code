name: Finalize Sip Journal
on:
  push:
    branches: [work/sip-journal-v1]
    paths: ['.github/workflows/sip-finalize-temp.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded journal-only fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('sip')
          def change(file, old, new):
              p=root/file
              s=p.read_text()
              if old not in s: raise RuntimeError('Unexpected source: '+str(p))
              p.write_text(s.replace(old,new))
          change('assets/domain.js', "webSummary:text(raw.webSummary,5000),sources:", "webSummary:text(raw.webSummary,5000),searchSuggestions:text(raw.searchSuggestions,20000),sources:")
          change('assets/domain.js', "sources:[],webSummary:'',photos:[]", "sources:[],webSummary:'',searchSuggestions:'',photos:[]")
          change('assets/domain.js', "if(found){next={...next,id:found.id,createdAt:found.createdAt,updatedAt:now};", "if(found){if(!existingTastingId&&next.id!==found.id){for(const k of ['cover','labelText','country','region','grape','cask'])if(!next[k])next[k]=found[k];}next={...next,id:found.id,createdAt:found.createdAt,updatedAt:now};")
          change('assets/app.js', 'waitingWorker=null;', 'waitingWorker=null,preferenceWrite=Promise.resolve();')
          change('assets/app.js', "open(id?'编辑这份记忆':'새로운 기억',UI.editor(edit.b,edit.t));$('#sheet-title').textContent=id?'기억 수정':'새로운 기억';", "open(id?'기억 수정':'새로운 기억',UI.editor(edit.b,edit.t));")
          change('assets/app.js', "target.webSummary=result.summary||'';target.sources=result.sources||[];", "target.webSummary=result.summary||'';target.searchSuggestions=result.searchSuggestions||'';target.sources=result.sources||[];")
          change('assets/app.js', "if(setting){const next=structuredClone(state());next.settings[setting.dataset.setting]=setting.dataset.value;await persist(next);render();return;}", "if(setting){const key=setting.dataset.setting,value=setting.dataset.value;preferenceWrite=preferenceWrite.catch(()=>{}).then(async()=>{const next=structuredClone(state());next.settings[key]=value;await persist(next);render();toast('설정을 저장했어요.');});await preferenceWrite;return;}")
          change('assets/ui.js', "${button('출처와 함께 웹 평가 찾기','reviews'", "${t.searchSuggestions?suggestionsFrame(t.searchSuggestions):''}${button('출처와 함께 웹 평가 찾기','reviews'")
          p=root/'assets/ui.js'
          p.write_text(p.read_text()+'''\nexport function suggestionsFrame(html){const csp="default-src 'none'; style-src 'unsafe-inline'; img-src https: data:; font-src https:; base-uri 'none'; form-action 'none'";const doc=`<!doctype html><html><head><meta http-equiv="Content-Security-Policy" content="${csp}"><meta name="referrer" content="no-referrer"><base target="_blank"></head><body>${html}</body></html>`;return `<iframe title="Google 검색 제안" sandbox="allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer" style="border:0;width:100%;min-height:120px" srcdoc="${esc(doc)}"></iframe>`;}\n''')
          for key,value in [('accent','blue'),('background','dark'),('accent','red'),('background','cream')]:
              old=f"await page.locator('[data-setting={key}][data-value={value}]').click();"
              change('tests/browser.mjs',old,old+f"await page.waitForFunction(()=>document.body.dataset.{key}==='{value}');")
          p=root/'tests/domain.test.mjs'
          p.write_text(p.read_text()+'''\ntest('repeated import preserves an existing cover and label text',()=>{let s=putExperience(emptyState(),{title:'A',kind:'wine',cover:'data:image/png;base64,YQ==',labelText:'원래 라벨'},{date:'2026-09-20'});s=putExperience(s,{title:'A',kind:'wine'},{date:'2026-09-21'});assert.equal(s.bottles[0].cover,'data:image/png;base64,YQ==');assert.equal(s.bottles[0].labelText,'원래 라벨');});\ntest('Google suggestions are isolated from the parent application',async()=>{const {suggestionsFrame}=await import('../assets/ui.js');const html=suggestionsFrame('<script>parent.localStorage.clear()</script>');assert.ok(html.includes('sandbox="allow-popups allow-popups-to-escape-sandbox"'));assert.ok(!html.includes('allow-scripts'));assert.ok(!html.includes('allow-same-origin'));assert.ok(html.includes('&lt;script&gt;'));});\n''')
          PY
      - name: Syntax and unit regression
        working-directory: sip
        run: |
          for f in assets/*.js server/*.mjs sw.js; do node --check "$f"; done
          TZ=Asia/Seoul npm test
          TZ=America/New_York npm test
      - name: Install browser
        working-directory: sip
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Real browser validation
        working-directory: sip
        run: node tests/browser.mjs
      - name: Commit tested fixes on this branch only
        run: |
          git diff --check
          git add sip/assets/app.js sip/assets/domain.js sip/assets/ui.js sip/tests/browser.mjs sip/tests/domain.test.mjs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(sip): preserve metadata and serialize settings; verify mobile flows'
          git push origin HEAD:work/sip-journal-v1
      - name: Archive current source
        if: always()
        run: zip -qr sip-source.zip sip -x 'sip/node_modules/*' 'sip/test-results/*'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sip-final-validation
          path: |
            sip/test-results/
            sip-source.zip
          retention-days: 14
