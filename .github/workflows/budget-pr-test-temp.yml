name: Budget PR Tests

on:
  push:
    branches:
      - codex/budget-history-search

jobs:
  test-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test Asia/Seoul
        run: cd budget && TZ=Asia/Seoul npm test
      - name: Test America/New_York
        run: cd budget && TZ=America/New_York npm test
      - name: JavaScript syntax
        run: |
          node --check budget/assets/js/app.js
          node --check budget/assets/js/cycles.js
          node --check budget/assets/js/cycle-ui.js
          node --check budget/assets/js/domain.js
          node --check budget/assets/js/repository.js
      - name: Diff check
        run: git diff --check origin/main...HEAD
