name: Verify published Sip Journal
on:
  push:
    branches: [work/sip-journal-v1]
    paths: ['.github/workflows/sip-deployed-check-temp.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read published site without credentials
        run: |
          python3 - <<'PY'
          import json,time
          import urllib.request,urllib.error
          base='https://jhkim05-star.github.io/code/sip/'
          report=[]
          paths=['','version.json','assets/app.js?v=1.0.0','assets/domain.js','assets/ui.js','assets/storage.js','assets/api.js','assets/style.css?v=1.0.0','assets/icon-180.png','assets/icon-192.png','assets/icon-512.png','sw.js','manifest.webmanifest']
          for path in paths:
              req=urllib.request.Request(base+path,headers={'User-Agent':'SipJournalDeploymentValidation/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=30) as res:
                  data=res.read()
                  assert res.status==200,(path,res.status)
                  assert len(data)>20,path
                  if path=='version.json':assert json.loads(data)['version']=='1.0.0'
                  if path=='':assert '잔의 기록' in data.decode()
                  report.append({'path':path or './','status':res.status,'bytes':len(data)})
          for path in ['server/index.mjs','.env.example','tests/server.test.mjs']:
              try:
                  with urllib.request.urlopen(base+path,timeout=30) as res:
                      raise AssertionError('private/runtime file exposed: '+path)
              except urllib.error.HTTPError as e:
                  assert e.code==404,(path,e.code)
                  report.append({'path':path,'status':404})
          print(json.dumps({'url':base,'version':'1.0.0','checks':report},ensure_ascii=False,indent=2))
          with open('published-check.json','w') as f:json.dump({'url':base,'version':'1.0.0','checks':report},f,ensure_ascii=False,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sip-published-check
          path: published-check.json
          retention-days: 7
