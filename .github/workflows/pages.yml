# 기존 정적 앱과 빌드한 가족 게임을 GitHub Pages 로 배포합니다.
# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꾸면 동작합니다.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/reading-movie-log-app-3nofty
  workflow_dispatch:

# Pages 배포에 필요한 최소 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 가족 게임 빌드
        if: ${{ hashFiles('family-roguelike/package.json') != '' }}
        working-directory: family-roguelike
        run: |
          npm install
          npm run build

      - name: 배포 파일 모으기
        run: |
          mkdir -p _site
          cp index.html _site/
          for app in reading workout budget; do
            if [ -d "$app" ]; then cp -R "$app" _site/; fi
          done
          if [ -d family-roguelike/dist ]; then
            mkdir -p _site/family-roguelike
            cp -R family-roguelike/dist/. _site/family-roguelike/
          fi

      - name: 정적 파일 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
