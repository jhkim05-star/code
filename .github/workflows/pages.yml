# 저장소의 정적 파일을 그대로 GitHub Pages 로 배포합니다.
# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꾸면 동작합니다.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/reading-movie-log-app-3nofty
  workflow_dispatch:

# Pages 배포에 필요한 최소 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 정적 파일 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          # 빌드 단계가 없는 정적 앱이므로 저장소 루트를 그대로 올린다
          path: .

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
