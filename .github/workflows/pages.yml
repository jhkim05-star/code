# 기존 정적 앱과 빌드한 가족 게임을 GitHub Pages 로 배포합니다.
# 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꾸면 동작합니다.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/reading-movie-log-app-3nofty
  workflow_dispatch:

# Pages 배포에 필요한 최소 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 가족 게임 빌드 (family-roguelike)
        if: ${{ hashFiles('family-roguelike/package.json') != '' }}
        working-directory: family-roguelike
        run: |
          npm install
          npm run build

      - name: 가족 게임 빌드 (game)
        if: ${{ hashFiles('game/package.json') != '' }}
        working-directory: game
        run: |
          npm install
          npm run build

      - name: 배포 파일 모으기
        run: |
          mkdir -p _site
          cp index.html _site/
          for app in reading workout budget haru-page; do
            if [ -d "$app" ]; then cp -R "$app" _site/; fi
          done
          # 잔의 기록은 공개 파일만 배포합니다. 인증 서버·실행 데이터는 제외합니다.
          if [ -d sip ]; then
            mkdir -p _site/sip
            cp sip/index.html sip/manifest.webmanifest sip/sw.js sip/version.json sip/README.md _site/sip/
            cp -R sip/assets _site/sip/
            # 추적된 소스만 별도 내려받기용으로 제공합니다. 실제 키와 노트는 포함하지 않습니다.
            git archive --format=zip --output=_site/sip/sip-source.zip HEAD sip
          fi
          if [ -d family-roguelike/dist ]; then
            mkdir -p _site/family-roguelike
            cp -R family-roguelike/dist/. _site/family-roguelike/
          fi
          if [ -d game/dist ]; then
            mkdir -p _site/game
            cp -R game/dist/. _site/game/
          fi

      - name: 정적 파일 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 잔의 기록 실제 배포 주소 확인
        if: ${{ hashFiles('sip/version.json') != '' }}
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path
          base=os.environ['PAGE_URL'].rstrip('/')+'/sip/'
          expected=json.loads(Path('sip/version.json').read_text())
          error=None
          for attempt in range(18):
              try:
                  stamp='?verify='+str(int(time.time()))
                  with urllib.request.urlopen(base+'version.json'+stamp, timeout=15) as r:
                      actual=json.load(r)
                  if actual!=expected: raise RuntimeError('배포 버전이 아직 일치하지 않습니다.')
                  for name in ['index.html','assets/app.js','assets/domain.js','assets/icon-192.png','manifest.webmanifest','sw.js','sip-source.zip']:
                      with urllib.request.urlopen(base+name+stamp, timeout=15) as r:
                          if r.status!=200 or not r.read(32): raise RuntimeError(name+' 응답 오류')
                  print('LIVE_URL='+base)
                  print('LIVE_VERSION='+actual['version'])
                  print('PUBLIC_FILES_OK=true; AI_SERVER_NOT_ACTIVATED=true')
                  break
              except Exception as exc:
                  error=exc
                  if attempt==17: raise
                  time.sleep(5)
          PY
