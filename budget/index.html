<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2f72df">
  <meta name="description" content="카드 결제주기와 예산을 한눈에 보는 local-first 개인 가계부">
  <title>하루살림</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <link rel="stylesheet" href="assets/css/app.css?v=1.6.4">
</head>
<body data-theme="blue" data-background="white">
  <div id="app"><main class="shell"><p class="loading">가계부를 여는 중입니다.</p></main></div>
  <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
  <script type="module" src="assets/js/app.js?v=1.6.4"></script>
  <script>
    window.__budgetBootTimer=setTimeout(()=>{
      const loading=document.querySelector('#app .loading');if(!loading)return;
      document.querySelector('#app').innerHTML='<main class="shell"><section class="card"><h1>업데이트를 마무리하지 못했어요.</h1><p class="sub">가계부 기록은 그대로 있습니다. 아래 버튼은 가계부 화면 캐시만 새로 받고 저장 데이터는 삭제하지 않습니다.</p><div style="height:16px"></div><button id="recover-budget-app" class="primary wide">가계부 업데이트 다시 받기</button><p id="recover-budget-status" class="hint" role="status"></p></section></main>';
      document.querySelector('#recover-budget-app').onclick=async event=>{const button=event.currentTarget,status=document.querySelector('#recover-budget-status');button.disabled=true;status.textContent='가계부 화면을 새로 준비하고 있어요.';try{if('serviceWorker'in navigator){const registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.filter(item=>item.scope.includes('/budget/')).map(item=>item.unregister()));}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(key=>key.startsWith('budget-pwa-')).map(key=>caches.delete(key)));}}catch{}location.replace(`./?recovery=${Date.now()}`);};
    },8000);
  </script>
</body>
</html>
